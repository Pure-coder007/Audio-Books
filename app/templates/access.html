{% extends 'base.html' %}{% block content %}<div class="section-shell narrow page-shell"><span class="eyebrow">Welcome back</span><h1>Open your shelf.</h1><p>Confirm below to use your secure listening link.</p><form method="post" action="{{ url_for('library.redeem', token=token) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% if download_id %}<input type="hidden" name="download" value="{{ download_id }}">{% endif %}<button class="button">{{ "Download my audiobook ↓" if download_id else "Open my purchases ↗" }}</button></form></div>{% endblock %}
