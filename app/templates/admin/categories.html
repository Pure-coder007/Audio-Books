{% extends 'admin/base.html' %}{% from 'macros.html' import pagination %}{% block admin_content %}<h1>Genres.</h1><form class="inline-form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="sr-only" for="genre-name">New genre name</label><input id="genre-name" name="name" placeholder="New genre name" maxlength="80" value="{{ request.form.get('name', '') }}" {% if field_errors.get('name') %}aria-invalid="true" aria-describedby="name-error"{% endif %} required><button class="button">Add genre +</button></form>{% if field_errors.get('name') %}<p class="field-error" id="name-error" role="alert">{{ field_errors['name'] }}</p>{% endif %}<div class="genre-grid">{% for genre in categories %}<div>{{ genre.name }}<small>{{ genre.slug }}</small></div>{% endfor %}</div>{{ pagination(page) }}{% endblock %}
